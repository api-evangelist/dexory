aid: dexory
name: Dexory
description: >-
  Dexory is a UK-based warehouse intelligence and robotics company whose
  DexoryView platform pairs fleets of autonomous mobile scanning robots with
  physical AI to deliver real-time "ground truth" visibility across warehouses
  and distribution centers. The robots autonomously scan more than 10,000 pallet
  locations per hour and up to 18 meters of racking height, building a live
  digital twin that feeds AI-driven analytics for inventory accuracy, space and
  slotting optimization, damage/compliance detection, and operational
  performance. DexoryView is organized into modules (Integrity for stock
  accuracy and automated cycle counts, Optimise for space and productivity
  analytics, and Adapt for real-time operational response) and connects into
  existing warehouse and ERP systems such as SAP EWM, Manhattan, Blue Yonder,
  and Körber through pre-built connectors. Dexory serves 3PL logistics,
  manufacturing, food & beverage, retail, pharma, and air cargo operators.
  Added to the API Evangelist network from Atomico's portfolio and enriched via
  the pipeline; Dexory does not currently publish a public developer portal or
  OpenAPI.
